# Builds client data.js number fields from the TDS Data Warehouse (BigQuery amazon_ads). See tools/warehouse/run.js.
# Read-only towards the warehouse: signs in keyless as dashboard-reader@ (Workload Identity, main branch of td-dashboard
# only; set up once by xecutive-ads deploy/dashboard-reader-setup.sh). No Amazon, MerchantSpring or Claude calls.
# Daily at 08:41 UTC (08:41 UK in winter, 09:41 in summer), after the 07:23 Commerce Load: builds and commits every client
# marked live: true in tools/warehouse/clients.js (Balance 8 from 22 Nov 2026). Manual runs: dry_run = true compares only; false writes and commits.
name: Warehouse build

on:
  schedule:
    - cron: '41 8 * * *'
  workflow_dispatch:
    inputs:
      client:
        description: 'Client folder (only clients listed in tools/warehouse/clients.js)'
        required: true
        default: balance8
      dry_run:
        description: 'true = compare only, write nothing'
        type: boolean
        default: true

concurrency:
  group: warehouse-build
  cancel-in-progress: false

env:
  PROJECT_NUMBER: '874703822438' # tds-amazon-ads; not a secret

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix tools/warehouse --no-audit --no-fund
      - run: cd tools/warehouse && npm test
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/dashboards
          service_account: dashboard-reader@tds-amazon-ads.iam.gserviceaccount.com
      - name: Build
        run: node tools/warehouse/run.js "${{ github.event_name == 'schedule' && '--live' || inputs.client }}" ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Commit
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "TDS warehouse build"
          git config user.email "admin@tdstrategists.co.uk"
          git add clients/*/data.js index.html
          git diff --cached --quiet && { echo "No change"; exit 0; }
          git commit -m "Warehouse build: ${{ github.event_name == 'schedule' && 'live clients' || inputs.client }} ($(date -u +%F))"
          git push
